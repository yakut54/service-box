services:
  app:
    build: .
    container_name: servicebox_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - vendor:/var/www/html/vendor
      - storage:/var/www/html/storage
      - bootstrap_cache:/var/www/html/bootstrap/cache
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-servicebox}
      DB_USERNAME: ${DB_USERNAME:-servicebox}
      DB_PASSWORD: ${DB_PASSWORD}
      QUEUE_CONNECTION: sync
      CACHE_STORE: file
      SESSION_DRIVER: file
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-sb_widget_bot}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: servicebox_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-servicebox}
      POSTGRES_USER: ${DB_USERNAME:-servicebox}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-servicebox}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    image: nginx:alpine
    container_name: servicebox_web
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - storage:/var/www/html/storage:ro

  n8n:
    image: n8nio/n8n:latest
    container_name: servicebox_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: n8n.yakut54.ru
      N8N_PORT: "5678"
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://n8n.yakut54.ru/
      GENERIC_TIMEZONE: Europe/Moscow
      N8N_LOG_LEVEL: info
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  pgdata:
  vendor:
  storage:
  bootstrap_cache:
  n8n_data:
