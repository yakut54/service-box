services:
  app:
    build: .
    container_name: servicebox_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - vendor:/var/www/html/vendor
      - storage:/var/www/html/storage
      - bootstrap_cache:/var/www/html/bootstrap/cache
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-servicebox}
      DB_USERNAME: ${DB_USERNAME:-servicebox}
      DB_PASSWORD: ${DB_PASSWORD}
      QUEUE_CONNECTION: database
      CACHE_STORE: file
      SESSION_DRIVER: file
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-ssl}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@example.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-ServiceBox}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-sb_widget_bot}
      TELEGRAM_SECRET_TOKEN: ${TELEGRAM_SECRET_TOKEN:-}
      FIREBASE_CREDENTIALS_PATH: ${FIREBASE_CREDENTIALS_PATH:-}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID}
      REVERB_APP_KEY: ${REVERB_APP_KEY}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET}
      REVERB_HOST: reverb
      REVERB_PORT: 6001
      REVERB_SCHEME: http
    depends_on:
      db:
        condition: service_healthy

  reverb:
    build: .
    container_name: servicebox_reverb
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan reverb:start --host=0.0.0.0 --port=6001
    ports:
      # Только localhost — реальные браузер/мобильные клиенты и так всегда
      # идут через host nginx (wss://домен/app/, см. VITE_REVERB_HOST в
      # deploy.sh), не напрямую по IP:6001 — публиковать порт наружу не
      # нужно (тот же приём, что у web/db выше). Общение app↔reverb внутри
      # docker-сети (BROADCAST_CONNECTION=reverb) идёт по имени сервиса,
      # этой публикации не касается.
      - "127.0.0.1:6001:6001"
    volumes:
      - ./:/var/www/html
      - vendor:/var/www/html/vendor
      - storage:/var/www/html/storage
      - bootstrap_cache:/var/www/html/bootstrap/cache
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-servicebox}
      DB_USERNAME: ${DB_USERNAME:-servicebox}
      DB_PASSWORD: ${DB_PASSWORD}
      QUEUE_CONNECTION: database
      CACHE_STORE: file
      SESSION_DRIVER: file
      BROADCAST_CONNECTION: reverb
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 6001
      REVERB_APP_ID: ${REVERB_APP_ID}
      REVERB_APP_KEY: ${REVERB_APP_KEY}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET}
      REVERB_HOST: reverb
      REVERB_PORT: 6001
      REVERB_SCHEME: http
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: servicebox_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-servicebox}
      POSTGRES_USER: ${DB_USERNAME:-servicebox}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      # Только localhost на самом сервере — снаружи недоступно, доступ
      # только через SSH-туннель (см. DBeaver: вкладка SSH в настройках
      # соединения).
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-servicebox}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    image: nginx:alpine
    container_name: servicebox_web
    restart: unless-stopped
    depends_on:
      - app
    ports:
      # Только localhost — снаружи недоступно, доступ только через host
      # nginx (см. /etc/nginx/sites-enabled на сервере, тот же приём, что
      # у db ниже). Раньше был "8000:80" (публично!) — этот контейнер
      # говорит с PHP-FPM через fastcgi_pass, который НЕ фильтрует
      # X-Forwarded-For (в отличие от proxy_pass в host nginx с
      # $proxy_add_x_forwarded_for) — кто угодно, подключившись сюда
      # НАПРЯМУЮ в обход host nginx, мог подделать $request->ip() во всём
      # приложении чем угодно, включая allowlist вебхука ЮKassa
      # (VerifyYooKassaWebhook) — подтверждено живым тестом 2026-09-15,
      # поддельный payment.succeeded реально проходил проверку IP.
      - "127.0.0.1:8000:80"
    volumes:
      - ./:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - storage:/var/www/html/storage:ro

  scheduler:
    build: .
    container_name: servicebox_scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan schedule:work
    volumes:
      - ./:/var/www/html
      - vendor:/var/www/html/vendor
      - storage:/var/www/html/storage
      - bootstrap_cache:/var/www/html/bootstrap/cache
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-servicebox}
      DB_USERNAME: ${DB_USERNAME:-servicebox}
      DB_PASSWORD: ${DB_PASSWORD}
      QUEUE_CONNECTION: database
      CACHE_STORE: file
      SESSION_DRIVER: file
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-ssl}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@example.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-ServiceBox}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-sb_widget_bot}
      FIREBASE_CREDENTIALS_PATH: ${FIREBASE_CREDENTIALS_PATH:-}
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    container_name: servicebox_worker
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --tries=3 --backoff=60 --timeout=60 --sleep=3
    volumes:
      - ./:/var/www/html
      - vendor:/var/www/html/vendor
      - storage:/var/www/html/storage
      - bootstrap_cache:/var/www/html/bootstrap/cache
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-servicebox}
      DB_USERNAME: ${DB_USERNAME:-servicebox}
      DB_PASSWORD: ${DB_PASSWORD}
      QUEUE_CONNECTION: database
      CACHE_STORE: file
      SESSION_DRIVER: file
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-ssl}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@example.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-ServiceBox}
      FIREBASE_CREDENTIALS_PATH: ${FIREBASE_CREDENTIALS_PATH:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  vendor:
  storage:
  bootstrap_cache:
