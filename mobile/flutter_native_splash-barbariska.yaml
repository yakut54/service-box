# Splash-экран флейвора barbariska. Фон — тот же кремовый (#FFF6E5), что и
# базовая заливка AuroraBackground (см. lib/ui/splash_intro_screen.dart) —
# нативный экран держится только доли секунды до старта Flutter и сразу
# сменяется анимированным интро, поэтому цвет специально совпадает с его
# стартовым кадром: переход бесшовный, без рывка цвета.
flutter_native_splash:
  color: "#FFF6E5"
  image: "assets/icon/barbariska_app_icon.png"
  android_12:
    color: "#FFF6E5"
    image: "assets/icon/barbariska_app_icon.png"
