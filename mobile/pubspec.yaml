name: mobile
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.10.8

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  http: ^1.5.0
  audioplayers: ^6.1.0
  web_socket_channel: ^3.0.1
  url_launcher: ^6.3.2
  flutter_secure_storage: ^9.2.4
  pinput: ^5.0.1
  image_picker: ^1.1.2
  image: ^4.3.0
  share_plus: ^10.1.4
  gal: ^2.3.1
  path_provider: ^2.1.5
  # Своя шторка выбора фото (сетка + камера первой плиткой + мультиселект,
  # "как в Telegram/WhatsApp") — вместо системного ImagePicker.gallery,
  # переиспользуется и в чате, и в аватаре профиля (см.
  # mobile/lib/ui/widgets/photo_picker_sheet.dart). Своя сетка на
  # photo_manager напрямую — у wechat_assets_picker (использовался раньше)
  # нет режима шторки в принципе, весь его API жёстко пушит отдельный
  # full-screen route.
  photo_manager: ^3.6.4
  # AssetEntityImage — готовый виджет превью для AssetEntity, отдельный
  # пакет от той же команды (photo_manager сам его не тянет).
  photo_manager_image_provider: ^2.2.0

  # Push для доплаты за перевзвешенный заказ (см. lib/services/fcm_service.dart) —
  # пакеты добавлены, но сервис НЕ вызывается из main.dart, пока нет
  # google-services.json конкретного шопера (см. комментарий в fcm_service.dart).
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10

  # Плашки о новых сообщениях чата рисует система по FCM notification-блоку;
  # этот пакет нужен только чтобы СНЯТЬ их из шторки — когда сообщение удалили
  # (тихий push type=chat_deleted) или когда байер открыл этот чат
  # (см. lib/services/chat_notifications.dart). Сами уведомления через него не
  # публикуются.
  flutter_local_notifications: ^19.4.0

  # Помимо генерации нативного сплэша (dart run flutter_native_splash:create,
  # см. flutter_native_splash: ниже), нужен и в рантайме — FlutterNativeSplash
  # .preserve()/.remove() в main.dart синхронизируют момент, когда исчезает
  # нативный сплэш, с моментом, когда стартует анимация SplashIntroScreen.
  # Без этого Android сам решает, когда убрать сплэш, и может держать его
  # поверх уже тикающей анимации — байер увидит только хвост.
  flutter_native_splash: ^2.4.6

  # Русские подписи системных виджетов (например, кнопки в диалогах)
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Генерирует иконки приложения под все плотности экрана из одного PNG
  # (см. flutter_launcher_icons: ниже) — используется разово через
  # `dart run flutter_launcher_icons`, не нужен в рантайме.
  flutter_launcher_icons: ^0.14.3

# Иконка и сплэш настраиваются ПО ФЛЕЙВОРАМ, не одним общим блоком тут —
# см. flutter_launcher_icons-<flavor>.yaml и flutter_native_splash-<flavor>.yaml
# в корне mobile/. Оба пакета сами раскладывают результат в правильную папку
# флейвора (android/app/src/<flavor>/res/...) по имени файла конфига — руками
# копировать файлы больше не нужно. Новый флейвор = положить его иконку в
# assets/icon/, завести пару таких файлов и один раз прогнать генерацию
# (см. mobile/README.md).

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Иконки флейворов — те же PNG, что источники для ic_launcher/splash
  # (flutter_launcher_icons/flutter_native_splash), плюс рантайм-ассет для
  # анимированного интро (splash_intro_screen.dart, FlavorConfig.iconAssetPath).
  # Папкой целиком, а не файлом на флейвор — новый флейвор не требует правки
  # этого списка, только добавить сам PNG в assets/icon/.
  assets:
    - assets/icon/
    - assets/sounds/chat_notify.wav

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
