server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    # Docker's internal DNS — переспрашивает IP каждые 10с после пересборки контейнеров
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;

    # Widget JS (IIFE build) — no cache so deploys are instant
    location = /widget.js {
        root /var/www/html/widget/dist;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /widget.css {
        root /var/www/html/widget/dist;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Uploaded images (served directly from storage volume)
    location ^~ /storage/ {
        alias /var/www/html/storage/app/public/;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000";
        add_header Access-Control-Allow-Origin *;
    }

    # Laravel API (all routes prefixed /api by bootstrap/app.php)
    location ~ ^/(api|up)(/|$) {
        root /var/www/html/public;
        try_files $uri /index.php?$query_string;
    }

    # PHP-FPM handler
    location ~ \.php$ {
        root /var/www/html/public;
        set $upstream app:9000;
        include fastcgi_params;
        fastcgi_pass $upstream;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_read_timeout 120;
    }

    # Страница реквизитов — серверный рендеринг через Laravel (для верификации YooKassa)
    location = /kontakty {
        root /var/www/html/public;
        try_files $uri /index.php?$query_string;
    }

    # Страница результата платежа — серверный рендеринг через Laravel (возврат из ЮКасса)
    location = /payment/result {
        root /var/www/html/public;
        try_files $uri /index.php?$query_string;
    }

    # Платформенные юридические документы — server-rendered Blade
    location = /offer   { root /var/www/html/public; try_files $uri /index.php?$query_string; }
    location = /privacy { root /var/www/html/public; try_files $uri /index.php?$query_string; }

    # Юридические документы магазинов — server-rendered Blade (SEO + print)
    location ~ ^/legal(/|$) {
        root /var/www/html/public;
        try_files $uri /index.php?$query_string;
    }

    # Страница онлайн-записи для клиентов — server-rendered Blade
    location ~ ^/book(/|$) {
        root /var/www/html/public;
        try_files $uri /index.php?$query_string;
    }

    # API Demo Page — статический HTML без кеша
    location ^~ /page-api-example/ {
        root /var/www/html;
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Admin SPA — all other routes → index.html
    location / {
        root /var/www/html/admin/dist;
        try_files $uri $uri/ /index.html;

        # Cache static assets aggressively
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        # Never cache index.html
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
}