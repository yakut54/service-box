<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ServiceBox API — Демо</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <style>
    :root {
      --bg:       #f1f5f9;
      --card:     #ffffff;
      --primary:  #4f46e5;
      --primary-h:#4338ca;
      --text:     #0f172a;
      --muted:    #64748b;
      --border:   #e2e8f0;
      --success:  #059669;
      --danger:   #dc2626;
      --r: 8px;
      --shadow: 0 1px 4px rgba(0,0,0,.08);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
    }

    /* ── Шапка ─────────────────────────────── */
    .header {
      background: var(--primary);
      color: #fff;
      height: 56px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-logo {
      width: 32px; height: 32px; flex-shrink: 0;
      background: rgba(255,255,255,.2);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 15px;
    }
    .header h1 { font-size: 16px; font-weight: 700; }
    .header-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
    .rl-badge {
      background: rgba(255,255,255,.15);
      border-radius: 20px;
      padding: 3px 11px;
      font-size: 12px;
      display: none;
      align-items: center;
      gap: 5px;
    }
    .rl-badge.visible { display: flex; }
    .rl-dot { width: 7px; height: 7px; border-radius: 50%; background: #4ade80; }
    .rl-dot.warn { background: #fbbf24; }
    .rl-dot.crit { background: #f87171; }
    .header-ver {
      background: rgba(255,255,255,.15);
      border-radius: 20px;
      padding: 3px 11px;
      font-size: 12px;
    }

    /* ── Контейнер ─────────────────────────── */
    .wrap { max-width: 1200px; margin: 0 auto; padding: 20px 16px; }

    /* ── Карточки ──────────────────────────── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--r);
      box-shadow: var(--shadow);
      padding: 20px;
      margin-bottom: 16px;
    }

    /* ── API-ключ ──────────────────────────── */
    .key-hint { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
    .key-hint strong { color: var(--text); }
    .key-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .key-row label { font-weight: 600; white-space: nowrap; font-size: 13px; }
    .key-input {
      flex: 1; min-width: 220px;
      padding: 8px 12px;
      border: 1px solid var(--border); border-radius: var(--r);
      font-size: 13px; font-family: 'SF Mono','Fira Code',monospace;
    }
    .key-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,.12); }
    .connect-error { color: var(--danger); font-size: 13px; margin-top: 10px; }

    /* ── Шапка магазина ────────────────────── */
    .shop-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .shop-dot { width: 9px; height: 9px; background: var(--success); border-radius: 50%; flex-shrink: 0; }
    .shop-name { font-weight: 700; font-size: 15px; }
    .plan-tag {
      background: #fef9c3; color: #854d0e;
      padding: 2px 9px; border-radius: 20px;
      font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px;
    }

    /* ── Вкладки ───────────────────────────── */
    .tabs { display: flex; gap: 2px; border-bottom: 2px solid var(--border); margin-bottom: 20px; }
    .tab {
      padding: 9px 20px; background: none; border: none;
      cursor: pointer; font-size: 14px; color: var(--muted);
      border-bottom: 2px solid transparent; margin-bottom: -2px;
      border-radius: 6px 6px 0 0;
    }
    .tab:hover { color: var(--text); background: var(--bg); }
    .tab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }

    /* ── Фильтры ───────────────────────────── */
    .filters { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
    .filters label { font-size: 12px; color: var(--muted); white-space: nowrap; }
    .filters input, .filters select {
      padding: 6px 10px; border: 1px solid var(--border);
      border-radius: var(--r); font-size: 13px; background: var(--card);
    }
    .filters input:focus, .filters select:focus { outline: none; border-color: var(--primary); }

    /* ── Кнопки ────────────────────────────── */
    .btn {
      padding: 8px 18px; border: none; border-radius: var(--r);
      cursor: pointer; font-size: 13px; font-weight: 500; transition: all .15s;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-h); }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
    .btn-sm { padding: 5px 12px; font-size: 12px; }
    .btn-cancel { background: #fee2e2; color: var(--danger); }
    .btn-cancel:hover { background: #fecaca; }
    .btn-cancel:disabled { opacity: .4; cursor: not-allowed; }
    .btn-ghost {
      background: none; border: 1px solid var(--border);
      padding: 6px 14px; border-radius: var(--r);
      cursor: pointer; color: var(--muted); font-size: 13px;
    }
    .btn-ghost:hover { background: var(--bg); }
    .btn-create { background: #d1fae5; color: #065f46; }
    .btn-create:hover { background: #a7f3d0; }

    /* ── Таблица ───────────────────────────── */
    .t-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    thead th {
      padding: 9px 12px; text-align: left;
      background: #f8fafc; border-bottom: 1px solid var(--border);
      font-size: 11px; text-transform: uppercase; letter-spacing: .6px;
      color: var(--muted); white-space: nowrap; font-weight: 600;
    }
    tbody td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: #f8f9ff; }

    /* ── Бейджи ────────────────────────────── */
    .badge {
      display: inline-block; padding: 2px 9px; border-radius: 20px;
      font-size: 11px; font-weight: 600; white-space: nowrap;
    }
    .s-pending   { background: #f1f5f9; color: #475569; }
    .s-confirmed { background: #dbeafe; color: #1d4ed8; }
    .s-completed { background: #d1fae5; color: #065f46; }
    .s-cancelled { background: #fee2e2; color: #991b1b; }
    .s-active    { background: #d1fae5; color: #065f46; }
    .s-inactive  { background: #f1f5f9; color: #475569; }
    .s-yes       { background: #dbeafe; color: #1d4ed8; }
    .s-no        { background: #f1f5f9; color: #475569; }

    /* ── Состояния ─────────────────────────── */
    .state { text-align: center; padding: 52px 20px; color: var(--muted); }
    .state.err { color: var(--danger); }
    .spinner {
      display: inline-block; width: 20px; height: 20px;
      border: 2px solid var(--border); border-top-color: var(--primary);
      border-radius: 50%; animation: spin .65s linear infinite; margin-bottom: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Строка статуса (HTTP + время) ─────── */
    .status-bar {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 0 4px;
      font-size: 12px; color: var(--muted);
      border-top: 1px solid var(--border); margin-top: 4px;
    }
    .status-code {
      font-weight: 700; font-family: monospace; font-size: 13px;
    }
    .status-code.ok  { color: var(--success); }
    .status-code.err { color: var(--danger); }
    .status-code.warn { color: #d97706; }

    /* ── Пагинация ─────────────────────────── */
    .pager { display: flex; gap: 4px; align-items: center; justify-content: center; flex-wrap: wrap; padding-top: 16px; }
    .pager-btn { padding: 5px 11px; border: 1px solid var(--border); border-radius: 6px; background: var(--card); cursor: pointer; font-size: 13px; }
    .pager-btn:hover { background: var(--bg); }
    .pager-btn.cur { background: var(--primary); color: #fff; border-color: var(--primary); }
    .pager-btn:disabled { opacity: .35; cursor: not-allowed; }
    .pager-info { color: var(--muted); font-size: 12px; padding: 0 6px; }

    /* ── Curl / JSON панели ─────────────────── */
    .bottom-panels { margin-top: 20px; border-top: 1px solid var(--border); padding-top: 14px; display: flex; flex-direction: column; gap: 10px; }

    .panel-row { display: flex; align-items: center; gap: 8px; }
    .panel-toggle {
      flex: 1; background: none; border: none; cursor: pointer;
      font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; text-align: left;
    }
    .panel-toggle:hover { color: var(--text); }
    .panel-toggle .arr { font-size: 11px; }

    .copy-btn {
      background: none; border: 1px solid var(--border);
      border-radius: 6px; padding: 3px 10px;
      font-size: 12px; color: var(--muted); cursor: pointer;
      white-space: nowrap;
    }
    .copy-btn:hover { background: var(--bg); color: var(--text); }
    .copy-btn.ok { color: var(--success); border-color: var(--success); }

    .code-box {
      border-radius: var(--r); font-size: 12px; font-family: 'SF Mono','Fira Code',monospace;
      overflow-x: auto; margin-top: 6px; line-height: 1.7; white-space: pre;
      display: none;
    }
    .code-box.open { display: block; }

    .curl-box { background: #1e293b; color: #e2e8f0; padding: 14px 16px; }
    .c-comment { color: #94a3b8; }
    .c-key  { color: #f59e0b; }
    .c-url  { color: #34d399; }

    .json-box { background: #1e293b; color: #e2e8f0; padding: 14px 16px; max-height: 320px; overflow-y: auto; white-space: pre; }
    .json-key  { color: #93c5fd; }
    .json-str  { color: #86efac; }
    .json-num  { color: #fb923c; }
    .json-bool { color: #a5b4fc; }
    .json-null { color: #94a3b8; }

    /* ── Модальное окно ─────────────────────── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(15,23,42,.5);
      z-index: 1000;
      display: flex; align-items: center; justify-content: center;
      padding: 16px;
    }
    .modal-box {
      background: var(--card);
      border-radius: 12px;
      width: min(520px, 100%);
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
      display: flex; flex-direction: column;
      max-height: calc(100vh - 40px);
      overflow: hidden;
    }
    .modal-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
    }
    .modal-head h2 { font-size: 16px; font-weight: 700; }
    .modal-close {
      background: none; border: none; cursor: pointer;
      color: var(--muted); font-size: 18px; line-height: 1; padding: 4px;
    }
    .modal-close:hover { color: var(--text); }
    .modal-body { padding: 20px; overflow-y: auto; flex: 1; }
    .modal-foot {
      display: flex; justify-content: flex-end; gap: 8px;
      padding: 14px 20px; border-top: 1px solid var(--border);
    }

    .form-row { margin-bottom: 14px; }
    .form-row label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; }
    .form-row label span { font-weight: 400; color: var(--muted); }
    .form-row input, .form-row select, .form-row textarea {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--border); border-radius: var(--r);
      font-size: 13px; font-family: inherit; background: var(--card);
    }
    .form-row input:focus, .form-row select:focus, .form-row textarea:focus {
      outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,.1);
    }
    .form-row textarea { resize: vertical; min-height: 72px; }
    .form-divider { border: none; border-top: 1px solid var(--border); margin: 18px 0; }
    .form-error { color: var(--danger); font-size: 13px; margin-top: 8px; }
    .form-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    /* ── Утилиты ────────────────────────────── */
    .hidden { display: none !important; }
    .mono { font-family: 'SF Mono','Fira Code',monospace; font-size: 12px; }
    .dim { color: var(--muted); }

    /* ── Адаптив ────────────────────────────── */
    @media (max-width: 640px) {
      .wrap { padding: 12px 10px; }
      .header { padding: 0 12px; }
      .tab { padding: 8px 10px; font-size: 13px; }
      thead th, tbody td { padding: 7px 8px; font-size: 12px; }
      .form-row-2 { grid-template-columns: 1fr; }
    }
    @media (max-width: 380px) {
      .tab { padding: 7px 7px; font-size: 11px; }
      .header h1 { font-size: 13px; }
      .header-ver { display: none; }
    }
  </style>
</head>
<body>

<!-- ─── Шапка ───────────────────────────────────────── -->
<header class="header">
  <div class="header-logo">SB</div>
  <h1>ServiceBox API</h1>
  <div class="header-right">
    <div class="rl-badge" id="rl-badge">
      <div class="rl-dot" id="rl-dot"></div>
      <span id="rl-text">60 / 60</span>
    </div>
    <span class="header-ver">v1 · Demo</span>
  </div>
</header>

<div class="wrap">

  <!-- ─── API-ключ ──────────────────────────────────── -->
  <div class="card" id="s-key">
    <p class="key-hint">
      <strong>Введите API-ключ</strong> из вашего аккаунта ServiceBox.<br>
      Найти: <strong>Настройки → Интеграция</strong>. Доступно на тарифе Pro.
    </p>
    <div class="key-row">
      <label for="inp-key">API Ключ:</label>
      <input id="inp-key" class="key-input" type="text"
             placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
             autocomplete="off" spellcheck="false" />
      <button class="btn btn-primary" id="btn-connect" onclick="doConnect()">Подключиться</button>
    </div>
    <p class="connect-error hidden" id="conn-err"></p>
  </div>

  <!-- ─── Шапка магазина ────────────────────────────── -->
  <div class="card hidden" id="s-shop">
    <div class="shop-bar">
      <div class="shop-dot"></div>
      <span class="shop-name" id="shop-name"></span>
      <span class="plan-tag" id="shop-plan"></span>
      <button class="btn-ghost" style="margin-left:auto;" onclick="doDisconnect()">Сменить ключ</button>
    </div>
  </div>

  <!-- ─── Основной контент ──────────────────────────── -->
  <div class="hidden" id="s-main">

    <div class="tabs">
      <button class="tab active" data-t="bookings" onclick="switchTab('bookings')">Записи</button>
      <button class="tab"        data-t="clients"  onclick="switchTab('clients')">Клиенты</button>
      <button class="tab"        data-t="services" onclick="switchTab('services')">Услуги</button>
      <button class="tab"        data-t="masters"  onclick="switchTab('masters')">Мастера</button>
    </div>

    <div class="card">

      <!-- Фильтры: Записи -->
      <div id="f-bookings" class="filters">
        <label>Статус:</label>
        <select id="f-status" onchange="reload()">
          <option value="">Все</option>
          <option value="pending">Ожидает</option>
          <option value="confirmed">Подтверждена</option>
          <option value="completed">Завершена</option>
          <option value="cancelled">Отменена</option>
        </select>
        <label>С:</label>
        <input type="date" id="f-from" onchange="reload()" />
        <label>По:</label>
        <input type="date" id="f-to"   onchange="reload()" />
        <button class="btn btn-primary btn-sm" onclick="reload()">Обновить</button>
        <button class="btn btn-create btn-sm"  onclick="openCreateModal()">+ Создать запись</button>
      </div>

      <!-- Фильтры: Клиенты -->
      <div id="f-clients" class="filters hidden">
        <label>Поиск:</label>
        <input type="text" id="f-search" placeholder="Имя, телефон или email"
               oninput="lazyLoad()" style="width:230px;" />
        <button class="btn btn-primary btn-sm" onclick="reload()">Найти</button>
      </div>

      <!-- Фильтры: Услуги -->
      <div id="f-services" class="filters hidden">
        <button class="btn btn-primary btn-sm" onclick="reload()">Обновить</button>
      </div>

      <!-- Фильтры: Мастера -->
      <div id="f-masters" class="filters hidden">
        <label>Показать:</label>
        <select id="f-active" onchange="reload()">
          <option value="">Все</option>
          <option value="1">Только активные</option>
        </select>
        <button class="btn btn-primary btn-sm" onclick="reload()">Обновить</button>
      </div>

      <!-- Данные -->
      <div id="data-area"></div>

      <!-- Строка статуса HTTP -->
      <div class="status-bar hidden" id="status-bar">
        <span id="status-code" class="status-code"></span>
        <span id="status-time" class="dim"></span>
      </div>

      <!-- Пагинация -->
      <div id="pager" class="pager hidden"></div>

      <!-- Нижние панели: curl + JSON -->
      <div class="bottom-panels" id="bottom-panels" style="display:none;">

        <!-- Curl-пример -->
        <div>
          <div class="panel-row">
            <button class="panel-toggle" onclick="togglePanel('curl')">
              <span class="arr" id="curl-arr">▶</span>
              Посмотреть запрос (curl / JS)
            </button>
            <button class="copy-btn" id="copy-btn" onclick="copyCurl()">Копировать</button>
          </div>
          <div class="code-box curl-box" id="curl-box"></div>
        </div>

        <!-- JSON-ответ -->
        <div>
          <div class="panel-row">
            <button class="panel-toggle" onclick="togglePanel('json')">
              <span class="arr" id="json-arr">▶</span>
              Ответ API (JSON)
            </button>
          </div>
          <div class="code-box json-box" id="json-box"></div>
        </div>

      </div>
    </div>
  </div><!-- /s-main -->

</div><!-- /wrap -->

<!-- ─── Модалка: Создать запись ───────────────────────── -->
<div class="modal-overlay hidden" id="modal" onclick="onOverlayClick(event)">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-head">
      <h2>Создать запись</h2>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body">
      <div class="state"><div class="spinner"></div><br>Загрузка...</div>
    </div>
    <div class="modal-foot" id="modal-foot" style="display:none;">
      <button class="btn-ghost" onclick="closeModal()">Отмена</button>
      <button class="btn btn-primary" id="modal-submit" onclick="submitCreate()">Создать запись</button>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════
     JS
═══════════════════════════════════════════════════════ -->
<script>

// ── Конфиг ──────────────────────────────────────────────
const API_BASE = 'https://yakut54.ru/api/v1';
const LS_KEY   = 'sb_api_key_demo';

// ── Состояние ────────────────────────────────────────────
let apiKey   = '';
let curTab   = 'bookings';
let curPage  = 1;
let lazy     = null;
let curlOpen = false;
let jsonOpen = false;
let lastCurlText = '';   // plain text для копирования
let modalServices = [];  // услуги для формы
let modalMasters  = [];  // мастера для формы

// ── Инициализация ────────────────────────────────────────
(function init() {
  const saved = localStorage.getItem(LS_KEY);
  if (saved) {
    apiKey = saved;
    document.getElementById('inp-key').value = saved;
    connectWithKey(saved, true);
  }
})();

// ══════════════════════════════════════════════════════════
// ПОДКЛЮЧЕНИЕ
// ══════════════════════════════════════════════════════════

function doConnect() {
  const val = document.getElementById('inp-key').value.trim();
  if (!val) { showErr('Введите API-ключ'); return; }
  connectWithKey(val, false);
}

async function connectWithKey(key, silent) {
  const btn = document.getElementById('btn-connect');
  btn.disabled = true;
  btn.textContent = 'Проверяю...';
  hideErr();

  apiKey = key;

  try {
    // ──────────────────────────────────────────────────────
    // GET /api/v1/ping
    // Проверяет ключ и возвращает данные магазина.
    // Ответ: { ok: true, shop: "Название", plan: "pro", version: "1" }
    // ──────────────────────────────────────────────────────
    const data = await api('GET', '/ping');

    localStorage.setItem(LS_KEY, key);

    document.getElementById('shop-name').textContent = data.shop;
    document.getElementById('shop-plan').textContent  = data.plan.toUpperCase();

    show('s-shop'); hide('s-key'); show('s-main');
    loadData();

  } catch (e) {
    apiKey = '';
    if (!silent) showErr('Ошибка: ' + e.message);
    else localStorage.removeItem(LS_KEY);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Подключиться';
  }
}

function doDisconnect() {
  apiKey = '';
  localStorage.removeItem(LS_KEY);
  document.getElementById('inp-key').value = '';
  document.getElementById('rl-badge').classList.remove('visible');
  hide('s-shop'); hide('s-main'); show('s-key');
  hideErr();
}

// ══════════════════════════════════════════════════════════
// ВКЛАДКИ И ЗАГРУЗКА
// ══════════════════════════════════════════════════════════

function switchTab(tab) {
  curTab = tab; curPage = 1;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.t === tab));
  ['bookings','clients','services','masters'].forEach(t => {
    document.getElementById('f-' + t).classList.toggle('hidden', t !== tab);
  });
  loadData();
}

function reload(page) { curPage = page ?? 1; loadData(); }
function lazyLoad()   { clearTimeout(lazy); lazy = setTimeout(() => reload(), 450); }

function loadData() {
  setLoading();
  if      (curTab === 'bookings') loadBookings();
  else if (curTab === 'clients')  loadClients();
  else if (curTab === 'services') loadServices();
  else if (curTab === 'masters')  loadMasters();
}

// ── Отмена записи ────────────────────────────────────────
async function cancelBooking(id, btn) {
  if (!confirm(`Отменить запись ${shortId(id)}?`)) return;
  btn.disabled = true; btn.textContent = '...';
  try {
    // ──────────────────────────────────────────────────────
    // DELETE /api/v1/bookings/{id}
    // Отменяет запись (только pending или confirmed).
    // Клиент получит уведомление в Telegram/MAX если подключён.
    // Ответ: { message: "Booking cancelled", data: {...} }
    // Ошибки: 422 — уже отменена/завершена, 404 — не найдена
    // ──────────────────────────────────────────────────────
    await api('DELETE', '/bookings/' + id);
    reload(curPage);
  } catch (e) {
    alert('Ошибка: ' + e.message);
    btn.disabled = false; btn.textContent = 'Отменить';

async function submitCreate() {
  const serviceId = document.getElementById('m-service').value;
  const date      = document.getElementById('m-date').value;
  const time      = document.getElementById('m-time').value;
  const masterId  = document.getElementById('m-master').value;
  const name      = document.getElementById('m-name').value.trim();
  const phone     = document.getElementById('m-phone').value.trim();
  const email     = document.getElementById('m-email').value.trim();
  const notes     = document.getElementById('m-notes').value.trim();

  // Фронтовая валидация
  if (!serviceId) { setFormErr('Выберите услугу'); return; }
  if (!date || !time) { setFormErr('Укажите дату и время'); return; }
  if (!name)    { setFormErr('Укажите имя клиента'); return; }
  if (!phone)   { setFormErr('Укажите телефон'); return; }

  const startTime = new Date(date + 'T' + time).toISOString();

  const btn = document.getElementById('modal-submit');
  btn.disabled = true; btn.textContent = 'Создаю...';
  hideFormErr();

  try {
    // ──────────────────────────────────────────────────────
    // POST /api/v1/bookings
    // Тело запроса (JSON):
    //   service_id       — UUID услуги (обязательно)
    //   start_time       — ISO 8601 дата/время (обязательно, > now)
    //   master_id        — UUID мастера (опционально, автовыбор если не указан)
    //   customer.name    — имя клиента (обязательно)
    //   customer.phone   — телефон (обязательно)
    //   customer.email   — email (опционально)
    //   notes            — заметки (опционально)
    //
    // Ответ: 201 { message: "Booking created successfully", data: {...} }
    // Ошибки:
    //   409 — слот занят или нет свободных мастеров
    //   422 — ошибки валидации
    // ──────────────────────────────────────────────────────
    await api('POST', '/bookings', {
      service_id: serviceId,
      start_time: startTime,
      master_id:  masterId || null,
      customer: { name, phone, email: email || null },
      notes:    notes || null,
    });

    closeModal();
    // Переключаемся на вкладку Записи и обновляем
    if (curTab !== 'bookings') switchTab('bookings');
    else reload(1);

  } catch (e) {
    setFormErr(e.message);
  } finally {
    btn.disabled = false; btn.textContent = 'Создать запись';
  }
}

function closeModal() { hide('modal'); }
function onOverlayClick(e) { if (e.target === document.getElementById('modal')) closeModal(); }
function setFormErr(msg) { const el = document.getElementById('m-error'); el.textContent = msg; el.classList.remove('hidden'); }

function renderPager(meta) {
  const el = document.getElementById('pager');
  if (!meta || meta.last_page <= 1) { el.classList.add('hidden'); return; }
  el.classList.remove('hidden');
  const { page, last_page, total } = meta;
  const start = Math.max(1, page - 2);
  const end   = Math.min(last_page, start + 4);
  let html = `<button class="pager-btn" ${page <= 1 ? 'disabled' : ''} onclick="reload(${page-1})">←</button>`;
  if (start > 1) html += `<span class="pager-info">…</span>`;
  for (let p = start; p <= end; p++)
    html += `<button class="pager-btn ${p===page?'cur':''}" onclick="reload(${p})">${p}</button>`;
  if (end < last_page) html += `<span class="pager-info">…</span>`;
  html += `<button class="pager-btn" ${page>=last_page?'disabled':''} onclick="reload(${page+1})">→</button>`;
  html += `<span class="pager-info">${total.toLocaleString('ru-RU')} записей</span>`;
  el.innerHTML = html;
}

// CURL + JSON ПАНЕЛИ

function showPanels(method, path, qs, body, rawData) {
  document.getElementById('bottom-panels').style.display = '';

  const fullUrl = API_BASE + path + (qs ? '?' + qs : '');
  const masked  = apiKey.substring(0,8) + '...' + apiKey.slice(-4);

  // ── Plain text для копирования (полный ключ) ──
  lastCurlText = `curl -X ${method} "${fullUrl}" \\\n` +
    `     -H "X-API-Key: ${apiKey}" \\\n` +
    `     -H "Accept: application/json"`;
  if (body) lastCurlText += ` \\\n     -H "Content-Type: application/json" \\\n     -d '${JSON.stringify(body, null, 2)}'`;

  // ── HTML версия (с раскраской) ──
  let html = `<span class="c-comment"># curl</span>\n`;
  html += `curl -X ${method} <span class="c-url">"${fullUrl}"</span> \\\n`;
  html += `     -H <span class="c-key">"X-API-Key: ${masked}"</span> \\\n`;
  html += `     -H "Accept: application/json"`;
  if (body) html += ` \\\n     -H "Content-Type: application/json" \\\n     -d '${x(JSON.stringify(body, null, 2))}'`;

  html += `\n\n<span class="c-comment"># JavaScript (fetch)</span>\n`;
  html += `fetch(<span class="c-url">"${fullUrl}"</span>, {\n  method: "${method}",\n  headers: {\n`;
  html += `    <span class="c-key">"X-API-Key"</span>: "${masked}",\n    "Accept": "application/json"`;
  if (body) html += `,\n    "Content-Type": "application/json"`;
  html += `\n  }`;
  if (body) html += `,\n  body: JSON.stringify(${x(JSON.stringify(body, null, 2))})`;
  html += `\n})\n.then(r => r.json())\n.then(data => console.log(data));`;

  document.getElementById('curl-box').innerHTML = html;

  // ── JSON ответ ──
  document.getElementById('json-box').innerHTML = syntaxHighlight(rawData);
}

function togglePanel(which) {
  if (which === 'curl') {
    curlOpen = !curlOpen;
    document.getElementById('curl-box').classList.toggle('open', curlOpen);
    document.getElementById('curl-arr').textContent = curlOpen ? '▼' : '▶';
  } else {
    jsonOpen = !jsonOpen;
    document.getElementById('json-box').classList.toggle('open', jsonOpen);
    document.getElementById('json-arr').textContent = jsonOpen ? '▼' : '▶';
  }
}

function copyCurl() {
  if (!lastCurlText) return;
  const btn = document.getElementById('copy-btn');
  const orig = btn.textContent;
  navigator.clipboard.writeText(lastCurlText)
    .then(() => { btn.textContent = '✓ Скопировано'; btn.classList.add('ok'); })
    .catch(() => {
      // Fallback для старых браузеров
      const ta = document.createElement('textarea');
      ta.value = lastCurlText;
      ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      btn.textContent = '✓ Скопировано'; btn.classList.add('ok');
    })
    .finally(() => setTimeout(() => { btn.textContent = orig; btn.classList.remove('ok'); }, 2000));
}

// Простая JSON-подсветка без зависимостей
function syntaxHighlight(obj) {
  let str = typeof obj === 'string' ? obj : JSON.stringify(obj, null, 2);
  str = str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return str.replace(
    /("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g,
    m => {
      let cls = 'json-num';
      if (/^"/.test(m)) cls = /:$/.test(m) ? 'json-key' : 'json-str';
      else if (/true|false/.test(m)) cls = 'json-bool';
      else if (/null/.test(m)) cls = 'json-null';
      return `<span class="${cls}">${m}</span>`;
    }
  );
}

// ══════════════════════════════════════════════════════════
// БАЗОВЫЙ FETCH
// ══════════════════════════════════════════════════════════

async function api(method, fullPath, body, { silent = false } = {}) {
  const [path, qs] = fullPath.split('?');

  const url  = API_BASE + fullPath;
  const opts = {
    method,
    headers: { 'X-API-Key': apiKey, 'Accept': 'application/json', 'Content-Type': 'application/json' },
  };
  if (body) opts.body = JSON.stringify(body);

  const t0  = performance.now();
  const res = await fetch(url, opts);
  const ms  = Math.round(performance.now() - t0);

  // Rate limit (только если сервер вернул заголовок)
  const remaining = res.headers.get('X-RateLimit-Remaining');
  const limit     = res.headers.get('X-RateLimit-Limit');
  if (remaining !== null) updateRateLimit(parseInt(remaining), parseInt(limit) || 60);

  if (!silent) updateStatusBar(res.status, ms);

  // Пустой ответ
  if (res.status === 204) {
    if (!silent) showPanels(method, path, qs || '', body, {});
    return {};
  }

  let data;
  try { data = await res.json(); }
  catch { throw new Error(`HTTP ${res.status}`); }

  if (!silent) showPanels(method, path, qs || '', body, data);

  if (!res.ok) {
    if (data.errors) {
      throw new Error(Object.values(data.errors).flat().join('; ') || data.message || `HTTP ${res.status}`);
    }
    throw new Error(data.message || data.error || `HTTP ${res.status}`);
  }

  return data;
}

// УТИЛИТЫ
// ══════════════════════════════════════════════════════════

function x(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function shortId(id) {
  if (!id) return '—';
  const s = String(id);
  return s.length > 12 ? s.substring(0,8) + '…' : s;
}

function fmtDate(iso) {
  if (!iso) return '—';
  try { return new Date(iso).toLocaleString('ru-RU', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' }); }
  catch { return iso; }
}

function fmtMoney(n) { return Number(n).toLocaleString('ru-RU') + ' ₽'; }

function statusBadge(s) {
  const m = { pending:['s-pending','Ожидает'], confirmed:['s-confirmed','Подтверждена'],
              completed:['s-completed','Завершена'], cancelled:['s-cancelled','Отменена'] };
  const [cls, lbl] = m[s] || ['s-pending', s || '—'];
  return `<span class="badge ${cls}">${lbl}</span>`;
}

function canCancel(s) { return s === 'pending' || s === 'confirmed'; }

function show(id) { document.getElementById(id).classList.remove('hidden'); }
function hide(id) { document.getElementById(id).classList.add('hidden'); }

function showErr(msg) { const e=document.getElementById('conn-err'); e.textContent=msg; e.classList.remove('hidden'); }
function hideErr()    { document.getElementById('conn-err').classList.add('hidden'); }

document.getElementById('inp-key').addEventListener('keydown', e => { if (e.key==='Enter') doConnect(); });
document.addEventListener('keydown', e => { if (e.key==='Escape') closeModal(); });

</script>
