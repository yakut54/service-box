<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ServiceBox API — Демо</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <style>
    /* ========== CSS переменные ========== */
    :root {
      --bg:        #f1f5f9;
      --card:      #ffffff;
      --primary:   #4f46e5;
      --primary-h: #4338ca;
      --text:      #0f172a;
      --muted:     #64748b;
      --border:    #e2e8f0;
      --success:   #059669;
      --danger:    #dc2626;
      --warning:   #d97706;
      --info:      #2563eb;
      --r:         8px;
      --shadow:    0 1px 4px rgba(0,0,0,.08);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
    }

    /* ========== Шапка ========== */
    .header {
      background: var(--primary);
      color: #fff;
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-logo {
      width: 32px; height: 32px;
      background: rgba(255,255,255,.2);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 16px; flex-shrink: 0;
    }
    .header h1 { font-size: 17px; font-weight: 700; }
    .header-badge {
      margin-left: auto;
      background: rgba(255,255,255,.15);
      border-radius: 20px;
      padding: 3px 12px;
      font-size: 12px;
    }

    /* ========== Контейнер ========== */
    .wrap { max-width: 1200px; margin: 0 auto; padding: 24px 16px; }

    /* ========== Карточки ========== */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--r);
      box-shadow: var(--shadow);
      padding: 20px;
      margin-bottom: 16px;
    }

    /* ========== API-ключ ========== */
    .key-hint { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
    .key-hint strong { color: var(--text); }
    .key-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .key-row label { font-weight: 600; white-space: nowrap; font-size: 13px; }
    .key-input {
      flex: 1; min-width: 220px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: var(--r);
      font-size: 13px;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }
    .key-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,.12); }
    .connect-error { color: var(--danger); font-size: 13px; margin-top: 10px; }

    /* ========== Шапка магазина ========== */
    .shop-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .shop-dot { width: 10px; height: 10px; background: var(--success); border-radius: 50%; flex-shrink: 0; }
    .shop-name { font-weight: 700; font-size: 15px; }
    .plan-tag {
      background: #fef9c3; color: #854d0e;
      padding: 2px 10px; border-radius: 20px;
      font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px;
    }
    .btn-ghost {
      margin-left: auto;
      background: none; border: 1px solid var(--border);
      padding: 6px 14px; border-radius: var(--r);
      cursor: pointer; color: var(--muted); font-size: 13px;
    }
    .btn-ghost:hover { background: var(--bg); }

    /* ========== Вкладки ========== */
    .tabs { display: flex; gap: 2px; border-bottom: 2px solid var(--border); margin-bottom: 20px; }
    .tab {
      padding: 9px 20px; background: none; border: none;
      cursor: pointer; font-size: 14px; color: var(--muted);
      border-bottom: 2px solid transparent; margin-bottom: -2px;
      border-radius: 6px 6px 0 0; transition: color .15s;
    }
    .tab:hover { color: var(--text); background: var(--bg); }
    .tab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }

    /* ========== Фильтры ========== */
    .filters { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
    .filters label { font-size: 12px; color: var(--muted); white-space: nowrap; }
    .filters input, .filters select {
      padding: 6px 10px; border: 1px solid var(--border);
      border-radius: var(--r); font-size: 13px; background: var(--card);
    }
    .filters input:focus, .filters select:focus { outline: none; border-color: var(--primary); }

    /* ========== Кнопки ========== */
    .btn {
      padding: 8px 18px; border: none; border-radius: var(--r);
      cursor: pointer; font-size: 13px; font-weight: 500; transition: all .15s;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-h); }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
    .btn-sm { padding: 5px 12px; font-size: 12px; }
    .btn-cancel { background: #fee2e2; color: var(--danger); }
    .btn-cancel:hover { background: #fecaca; }
    .btn-cancel:disabled { opacity: .4; cursor: not-allowed; }

    /* ========== Таблица ========== */
    .t-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    thead th {
      padding: 9px 12px; text-align: left;
      background: #f8fafc; border-bottom: 1px solid var(--border);
      font-size: 11px; text-transform: uppercase; letter-spacing: .6px;
      color: var(--muted); white-space: nowrap; font-weight: 600;
    }
    tbody td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: #f8f9ff; }

    /* ========== Бейджи статусов ========== */
    .badge {
      display: inline-block; padding: 2px 9px; border-radius: 20px;
      font-size: 11px; font-weight: 600; white-space: nowrap;
    }
    .s-pending   { background: #f1f5f9; color: #475569; }
    .s-confirmed { background: #dbeafe; color: #1d4ed8; }
    .s-completed { background: #d1fae5; color: #065f46; }
    .s-cancelled { background: #fee2e2; color: #991b1b; }
    .s-active    { background: #d1fae5; color: #065f46; }
    .s-inactive  { background: #f1f5f9; color: #475569; }
    .s-yes       { background: #dbeafe; color: #1d4ed8; }
    .s-no        { background: #f1f5f9; color: #475569; }

    /* ========== Состояния загрузки/ошибки/пусто ========== */
    .state {
      text-align: center; padding: 52px 20px; color: var(--muted);
    }
    .state.err { color: var(--danger); }
    .spinner {
      display: inline-block; width: 22px; height: 22px;
      border: 2px solid var(--border); border-top-color: var(--primary);
      border-radius: 50%; animation: spin .65s linear infinite; margin-bottom: 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ========== Пагинация ========== */
    .pager {
      display: flex; gap: 4px; align-items: center;
      justify-content: center; flex-wrap: wrap; padding-top: 16px;
    }
    .pager-btn {
      padding: 5px 11px; border: 1px solid var(--border);
      border-radius: 6px; background: var(--card);
      cursor: pointer; font-size: 13px;
    }
    .pager-btn:hover { background: var(--bg); }
    .pager-btn.cur { background: var(--primary); color: #fff; border-color: var(--primary); }
    .pager-btn:disabled { opacity: .35; cursor: not-allowed; }
    .pager-info { color: var(--muted); font-size: 12px; padding: 0 6px; }

    /* ========== Curl-пример ========== */
    .curl-wrap { margin-top: 20px; border-top: 1px solid var(--border); padding-top: 14px; }
    .curl-toggle {
      background: none; border: none; cursor: pointer;
      font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px;
    }
    .curl-toggle:hover { color: var(--text); }
    .curl-toggle .arr { font-size: 11px; }
    .curl-box {
      background: #1e293b; color: #e2e8f0; border-radius: var(--r);
      padding: 14px 16px; font-size: 12px; font-family: 'SF Mono','Fira Code',monospace;
      overflow-x: auto; margin-top: 8px; line-height: 1.7; white-space: pre;
      display: none;
    }
    .curl-box.open { display: block; }
    .c-comment { color: #94a3b8; }
    .c-key { color: #f59e0b; }
    .c-url { color: #34d399; }

    /* ========== Мобайл ========== */
    @media (max-width: 640px) {
      .wrap { padding: 14px 10px; }
      .header { padding: 0 14px; }
      .header h1 { font-size: 15px; }
      .tab { padding: 8px 12px; font-size: 13px; }
      thead th, tbody td { padding: 8px 8px; font-size: 12px; }
    }
    @media (max-width: 380px) {
      .tab { padding: 7px 8px; font-size: 11px; }
      .header h1 { font-size: 13px; }
      .header-badge { display: none; }
    }
    @media (max-width: 320px) {
      .key-input { min-width: 140px; }
    }

    .hidden { display: none !important; }
    .mono { font-family: 'SF Mono','Fira Code',monospace; font-size: 12px; }
    .dim { color: var(--muted); }
  </style>
</head>
<body>

<!-- ===================================================
     ШАПКА
     =================================================== -->
<header class="header">
  <div class="header-logo">SB</div>
  <h1>ServiceBox API</h1>
  <span class="header-badge">v1 · Demo</span>
</header>

<div class="wrap">

  <!-- ===================================================
       ШАГ 1: ВВОД API-КЛЮЧА
       Показывается до подключения.
       Ключ берётся из: Настройки → Интеграция
       =================================================== -->
  <div class="card" id="s-key">
    <p class="key-hint">
      <strong>Введите API-ключ</strong> из вашего аккаунта ServiceBox.<br>
      Найти его можно: <strong>Настройки → Интеграция</strong>. Доступно на тарифе Pro.
    </p>
    <div class="key-row">
      <label for="inp-key">API Ключ:</label>
      <input
        id="inp-key"
        class="key-input"
        type="text"
        placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
        autocomplete="off"
        spellcheck="false"
      />
      <button class="btn btn-primary" id="btn-connect" onclick="doConnect()">Подключиться</button>
    </div>
    <p class="connect-error hidden" id="conn-err"></p>
  </div>

  <!-- ===================================================
       ПЛАШКА МАГАЗИНА
       Показывается после успешного подключения.
       =================================================== -->
  <div class="card hidden" id="s-shop">
    <div class="shop-bar">
      <div class="shop-dot"></div>
      <span class="shop-name" id="shop-name"></span>
      <span class="plan-tag" id="shop-plan"></span>
      <button class="btn-ghost" onclick="doDisconnect()">Сменить ключ</button>
    </div>
  </div>

  <!-- ===================================================
       ОСНОВНОЙ КОНТЕНТ
       =================================================== -->
  <div class="hidden" id="s-main">

    <!-- Вкладки -->
    <div class="tabs">
      <button class="tab active" data-t="bookings" onclick="switchTab('bookings')">Записи</button>
      <button class="tab"        data-t="clients"  onclick="switchTab('clients')">Клиенты</button>
      <button class="tab"        data-t="services" onclick="switchTab('services')">Услуги</button>
      <button class="tab"        data-t="masters"  onclick="switchTab('masters')">Мастера</button>
    </div>

    <div class="card">

      <!-- === Фильтры: Записи === -->
      <div id="f-bookings" class="filters">
        <label>Статус:</label>
        <select id="f-status" onchange="reload()">
          <option value="">Все</option>
          <option value="pending">Ожидает</option>
          <option value="confirmed">Подтверждена</option>
          <option value="completed">Завершена</option>
          <option value="cancelled">Отменена</option>
        </select>
        <label>С:</label>
        <input type="date" id="f-from" onchange="reload()" />
        <label>По:</label>
        <input type="date" id="f-to"   onchange="reload()" />
        <button class="btn btn-primary btn-sm" onclick="reload()">Обновить</button>
      </div>

      <!-- === Фильтры: Клиенты === -->
      <div id="f-clients" class="filters hidden">
        <label>Поиск:</label>
        <input type="text" id="f-search" placeholder="Имя, телефон или email"
               oninput="lazyLoad()" style="width:230px;" />
        <button class="btn btn-primary btn-sm" onclick="reload()">Найти</button>
      </div>

      <!-- === Фильтры: Услуги === -->
      <div id="f-services" class="filters hidden">
        <button class="btn btn-primary btn-sm" onclick="reload()">Обновить</button>
      </div>

      <!-- === Фильтры: Мастера === -->
      <div id="f-masters" class="filters hidden">
        <label>Показать:</label>
        <select id="f-active" onchange="reload()">
          <option value="">Все</option>
          <option value="1">Только активные</option>
        </select>
        <button class="btn btn-primary btn-sm" onclick="reload()">Обновить</button>
      </div>

      <!-- Область данных -->
      <div id="data-area"></div>

      <!-- Пагинация -->
      <div id="pager" class="pager hidden"></div>

      <!-- Curl-пример -->
      <div class="curl-wrap" id="curl-wrap" style="display:none;">
        <button class="curl-toggle" onclick="toggleCurl()">
          <span class="arr" id="curl-arr">▶</span>
          Посмотреть как это сделать в коде (curl / JS / Python)
        </button>
        <div class="curl-box" id="curl-box"></div>
      </div>

    </div>
  </div><!-- /s-main -->

</div><!-- /wrap -->

<!-- =======================================================
     JavaScript
     =======================================================

  Структура:
    1. Конфиг
    2. Состояние
    3. Инициализация
    4. Подключение
    5. Переключение вкладок
    6. Загрузка данных (по вкладкам)
    7. Рендер таблиц
    8. Отмена записи
    9. Пагинация
   10. UI-утилиты (loading, error, empty)
   11. Curl-пример
   12. Базовый fetch-хелпер
   13. Форматирование

======================================================= -->
<script>

// ============================================================
// 1. КОНФИГ
// ============================================================

// Базовый URL API. Измените, если деплоите на другой домен.
const API_BASE = 'https://yakut54.ru/api/v1';

// Ключ в localStorage для хранения API-ключа
const LS_KEY = 'sb_api_key_demo';

// ============================================================
// 2. СОСТОЯНИЕ
// ============================================================

let apiKey   = '';          // Текущий API-ключ
let curTab   = 'bookings';  // Активная вкладка
let curPage  = 1;           // Текущая страница
let lastMeta = null;        // Последняя мета-информация пагинации
let lazy     = null;        // Таймер debounce для поиска
let curlOpen = false;       // Открыт ли curl-пример
let lastReq  = null;        // Последний запрос для curl

// ============================================================
// 3. ИНИЦИАЛИЗАЦИЯ — восстановить ключ из localStorage
// ============================================================

(function init() {
  const saved = localStorage.getItem(LS_KEY);
  if (saved) {
    apiKey = saved;
    document.getElementById('inp-key').value = saved;
    // Тихая проверка: ключ мог устареть
    connectWithKey(saved, /*silent=*/ true);
  }
})();

// ============================================================
// 4. ПОДКЛЮЧЕНИЕ / ОТКЛЮЧЕНИЕ
// ============================================================

function doConnect() {
  const val = document.getElementById('inp-key').value.trim();
  if (!val) { showErr('Введите API-ключ'); return; }
  connectWithKey(val, false);
}

async function connectWithKey(key, silent) {
  const btn = document.getElementById('btn-connect');
  btn.disabled = true;
  btn.textContent = 'Проверяю...';
  hideErr();

  apiKey = key; // выставляем до запроса, чтобы заголовок X-API-Key отправился

  try {
    // ---------------------------------------------------------
    // GET /api/v1/ping
    //
    // Самый простой запрос — просто проверяет ключ.
    // Если ключ верный, возвращает данные магазина.
    //
    // Ответ: { ok: true, shop: "Название", plan: "pro", version: "1" }
    //
    // Коды ответа:
    //   200 — ключ верный
    //   401 — ключ не найден / не передан
    //   403 — тариф не Pro
    // ---------------------------------------------------------
    const data = await api('GET', '/ping');

    localStorage.setItem(LS_KEY, key);

    document.getElementById('shop-name').textContent = data.shop;
    document.getElementById('shop-plan').textContent  = data.plan.toUpperCase();

    show('s-shop');
    hide('s-key');
    show('s-main');

    loadData();

  } catch (e) {
    apiKey = ''; // ключ не прошёл — сбрасываем
    if (!silent) showErr('Ошибка: ' + e.message);
    else localStorage.removeItem(LS_KEY);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Подключиться';
  }
}

function doDisconnect() {
  apiKey = '';
  localStorage.removeItem(LS_KEY);
  document.getElementById('inp-key').value = '';
  hide('s-shop');
  hide('s-main');
  show('s-key');
  hideErr();
}

// ============================================================
// 5. ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК
// ============================================================

function switchTab(tab) {
  curTab  = tab;
  curPage = 1;

  document.querySelectorAll('.tab').forEach(b => {
    b.classList.toggle('active', b.dataset.t === tab);
  });

  ['bookings', 'clients', 'services', 'masters'].forEach(t => {
    document.getElementById('f-' + t).classList.toggle('hidden', t !== tab);
  });

  loadData();
}

// ============================================================
// 6. ЗАГРУЗКА ДАННЫХ
// ============================================================

function reload(page) {
  curPage = (page !== undefined) ? page : 1;
  loadData();
}

function lazyLoad() {
  clearTimeout(lazy);
  lazy = setTimeout(() => reload(), 450);
}

function loadData() {
  setLoading();
  if      (curTab === 'bookings') loadBookings();
  else if (curTab === 'clients')  loadClients();
  else if (curTab === 'services') loadServices();
  else if (curTab === 'masters')  loadMasters();
}

// ============================================================
// 7а. ЗАГРУЗКА ЗАПИСЕЙ
// ============================================================

async function loadBookings() {
  const qs = new URLSearchParams({ page: curPage, per_page: 15 });

  const status = document.getElementById('f-status').value;
  const from   = document.getElementById('f-from').value;
  const to     = document.getElementById('f-to').value;

  if (status) qs.set('status',    status);
  if (from)   qs.set('date_from', from);
  if (to)     qs.set('date_to',   to);

  try {
    // ---------------------------------------------------------
    // GET /api/v1/bookings
    //
    // Возвращает список записей (bронирований) вашего магазина.
    //
    // Query-параметры (все необязательные):
    //   page       — страница (по умолчанию: 1)
    //   per_page   — записей на странице (по умолчанию: 50, макс: 100)
    //   status     — фильтр: pending | confirmed | completed | cancelled
    //   date_from  — с какой даты (YYYY-MM-DD)
    //   date_to    — по какую дату  (YYYY-MM-DD)
    //   master_id  — ID мастера (UUID)
    //
    // Каждая запись содержит:
    //   id, customer_name, customer_phone, customer_email,
    //   status, start_time, end_time, notes,
    //   service: { id, name, price },
    //   master:  { id, name }
    //
    // Ответ:
    //   { data: [...], meta: { total, page, per_page, last_page } }
    // ---------------------------------------------------------
    const res = await api('GET', '/bookings?' + qs);
    lastMeta = res.meta;
    renderBookings(res.data);
    renderPager(res.meta);
  } catch (e) {
    setError(e.message);
  }
}

function renderBookings(rows) {
  if (!rows.length) { setEmpty('Записей не найдено'); return; }

  const html = `
    <div class="t-wrap"><table>
      <thead><tr>
        <th>#</th>
        <th>Клиент</th>
        <th>Телефон</th>
        <th>Услуга</th>
        <th>Мастер</th>
        <th>Дата/Время</th>
        <th>Статус</th>
        <th></th>
      </tr></thead>
      <tbody>
        ${rows.map(b => `<tr>
          <td class="mono dim">${shortId(b.id)}</td>
          <td><strong>${x(b.customer_name)}</strong></td>
          <td class="mono">${x(b.customer_phone || '—')}</td>
          <td>${x(b.service?.name || '—')}</td>
          <td>${x(b.master?.name  || '—')}</td>
          <td style="white-space:nowrap;">${fmtDate(b.start_time)}</td>
          <td>${statusBadge(b.status)}</td>
          <td>
            ${canCancel(b.status)
              ? `<button class="btn btn-cancel btn-sm" data-id="${b.id}"
                         onclick="cancelBooking('${b.id}', this)">Отменить</button>`
              : ''}
          </td>
        </tr>`).join('')}
      </tbody>
    </table></div>
  `;
  document.getElementById('data-area').innerHTML = html;
}

// ============================================================
// 7б. ОТМЕНА ЗАПИСИ
// ============================================================

async function cancelBooking(id, btn) {
  if (!confirm(`Отменить запись ${shortId(id)}?`)) return;

  btn.disabled = true;
  btn.textContent = '...';

  try {
    // ---------------------------------------------------------
    // DELETE /api/v1/bookings/{id}
    //
    // Отменяет запись. Статус меняется на "cancelled".
    // Клиент получит уведомление, если подключён Telegram/MAX.
    //
    // Можно отменить только записи со статусом:
    //   pending (ожидает) или confirmed (подтверждена)
    //
    // Ответ при успехе:
    //   200 { message: "Booking cancelled." }
    //
    // Ошибки:
    //   422 — уже отменена или завершена
    //   404 — запись не найдена
    // ---------------------------------------------------------
    await api('DELETE', '/bookings/' + id);
    reload(curPage); // перезагружаем текущую страницу
  } catch (e) {
    alert('Ошибка: ' + e.message);
    btn.disabled = false;
    btn.textContent = 'Отменить';
  }
}

// ============================================================
// 8. ПАГИНАЦИЯ
// ============================================================

function renderPager(meta) {
  const el = document.getElementById('pager');
  if (!meta || meta.last_page <= 1) { el.classList.add('hidden'); return; }

  el.classList.remove('hidden');

  const { page, last_page, total } = meta;
  let html = '';

  html += `<button class="pager-btn" ${page <= 1 ? 'disabled' : ''}
             onclick="reload(${page - 1})">←</button>`;

  const start = Math.max(1, page - 2);
  const end   = Math.min(last_page, start + 4);

  if (start > 1) html += `<span class="pager-info">…</span>`;
  for (let p = start; p <= end; p++) {
    html += `<button class="pager-btn ${p === page ? 'cur' : ''}"
               onclick="reload(${p})">${p}</button>`;
  }
  if (end < last_page) html += `<span class="pager-info">…</span>`;

  html += `<button class="pager-btn" ${page >= last_page ? 'disabled' : ''}
             onclick="reload(${page + 1})">→</button>`;
  html += `<span class="pager-info">${total.toLocaleString('ru-RU')} записей</span>`;

  el.innerHTML = html;
}

// ============================================================
// 10. CURL-ПРИМЕР
// ============================================================

function showCurl(method, path, qs, body) {
  if (!lastReq) return;
  const wrap = document.getElementById('curl-wrap');
  wrap.style.display = '';

  const fullUrl = API_BASE + path + (qs ? '?' + qs : '');
  const maskedKey = apiKey.substring(0, 8) + '...' + apiKey.slice(-4);

  // Curl
  let curl = `<span class="c-comment"># curl</span>\n`;
  curl += `curl -X ${method} <span class="c-url">"${fullUrl}"</span> \\\n`;
  curl += `     -H <span class="c-key">"X-API-Key: ${maskedKey}"</span> \\\n`;
  curl += `     -H "Accept: application/json"`;
  if (body) {
    curl += ` \\\n     -H "Content-Type: application/json" \\\n`;
    curl += `     -d '${JSON.stringify(body)}'`;
  }

  // JavaScript (fetch)
  curl += `\n\n<span class="c-comment"># JavaScript</span>\n`;
  curl += `fetch(<span class="c-url">"${fullUrl}"</span>, {\n`;
  curl += `  method: "${method}",\n`;
  curl += `  headers: {\n`;
  curl += `    <span class="c-key">"X-API-Key"</span>: "${maskedKey}",\n`;
  curl += `    "Accept": "application/json"${body ? ',\n    "Content-Type": "application/json"' : ''}\n`;
  curl += `  }${body ? ',\n  body: JSON.stringify(' + JSON.stringify(body) + ')' : ''}\n`;
  curl += `})\n`;
  curl += `.then(r => r.json())\n`;
  curl += `.then(data => console.log(data));`;

  document.getElementById('curl-box').innerHTML = curl;
}

function toggleCurl() {
  curlOpen = !curlOpen;
  document.getElementById('curl-box').classList.toggle('open', curlOpen);
  document.getElementById('curl-arr').textContent = curlOpen ? '▼' : '▶';
}

// ============================================================
// 11. БАЗОВЫЙ FETCH-ХЕЛПЕР
// ============================================================

async function api(method, fullPath, body) {
  // Разбиваем path и qs для curl-примера
  const [path, qs] = fullPath.split('?');
  lastReq = { method, path, qs: qs || '', body };

  const url = API_BASE + fullPath;
  const opts = {
    method,
    headers: {
      'X-API-Key':    apiKey,
      'Accept':       'application/json',
      'Content-Type': 'application/json',
    },
  };
  if (body) opts.body = JSON.stringify(body);

  showCurl(method, path, qs || '', body);

  const res = await fetch(url, opts);

  // DELETE может вернуть 200 без тела
  if (res.status === 204) return {};

  // Попытаться распарсить JSON
  let data;
  try { data = await res.json(); }
  catch { throw new Error(`HTTP ${res.status}`); }

  if (!res.ok) {
    // Валидационные ошибки (422)
    if (data.errors) {
      const msgs = Object.values(data.errors).flat().join('; ');
      throw new Error(msgs || data.message || `HTTP ${res.status}`);
    }
    throw new Error(data.message || data.error || `HTTP ${res.status}`);
  }

  return data;
}

// ============================================================
// 12. УТИЛИТЫ
// ============================================================

// Экранирование HTML (защита от XSS в данных API)
function x(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// Короткий ID (для UUID — первые 8 символов)
function shortId(id) {
  if (!id) return '—';
  const s = String(id);
  return s.length > 12 ? s.substring(0, 8) + '…' : s;
}

// Форматирование даты
function fmtDate(iso) {
  if (!iso) return '—';
  try {
    return new Date(iso).toLocaleString('ru-RU', {
      day: '2-digit', month: '2-digit', year: 'numeric',
      hour: '2-digit', minute: '2-digit'
    });
  } catch { return iso; }
}

// Форматирование суммы в рублях
function fmtMoney(n) {
  return Number(n).toLocaleString('ru-RU') + ' ₽';
}

// Бейдж статуса записи
function statusBadge(status) {
  const map = {
    pending:   ['s-pending',   'Ожидает'],
    confirmed: ['s-confirmed', 'Подтверждена'],
    completed: ['s-completed', 'Завершена'],
    cancelled: ['s-cancelled', 'Отменена'],
  };
  const [cls, label] = map[status] || ['s-pending', status || '—'];
  return `<span class="badge ${cls}">${label}</span>`;
}

// Можно ли отменить запись
function canCancel(status) {
  return status === 'pending' || status === 'confirmed';
}

// show/hide по id
function show(id) { document.getElementById(id).classList.remove('hidden'); }
function hide(id) { document.getElementById(id).classList.add('hidden'); }

// Ошибка подключения
function showErr(msg) { const e = document.getElementById('conn-err'); e.textContent = msg; e.classList.remove('hidden'); }
function hideErr()    { document.getElementById('conn-err').classList.add('hidden'); }

// Enter в поле ключа
document.getElementById('inp-key').addEventListener('keydown', e => {
  if (e.key === 'Enter') doConnect();
});
