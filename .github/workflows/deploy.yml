name: Deploy to Production

on:
  push:
    branches:
      - flutter-app

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Незаданный секрет = пустая строка → || даёт фолбэк, текущая
          # настройка продолжит работать без добавления SSH_PORT / DEPLOY_PATH.
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            cd ${{ secrets.DEPLOY_PATH || '/var/www/servicebox' }}
            bash deploy.sh
